name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source and jq reference
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned Odin toolchain
        run: make bootstrap

      - name: Validate repository
        run: make validate

