name: merge-gate

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-untrusted-head
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          persist-credentials: false

      # This job intentionally has no repository secrets. The pull-request
      # checkout controls the Makefile and every command it invokes.
      - name: Install pinned Odin toolchain
        run: make bootstrap

      - name: Validate repository
        run: make validate

  review:
    name: review-isolated-net-diff
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out trusted review policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          persist-credentials: false

      - name: Check out pull-request history without submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Build the diff-only review packet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          policy/scripts/ci/build-review-packet.sh \
            source "$BASE_SHA" "$HEAD_SHA" review-input

      - name: Preserve trusted Vers controller
        run: |
          mkdir controller
          cp policy/scripts/ci/run-vers-review.sh controller/
          cp policy/scripts/ci/vers-review-vm.sh controller/

      - name: Remove repository checkouts
        run: rm -rf policy source

      - name: Confirm the isolation boundary
        run: |
          test "$(find . -mindepth 1 -maxdepth 1 -type d -print | sort)" = "$(printf './controller\n./review-input')"
          test ! -e .git
          find review-input -maxdepth 1 -type f -print | sort

      - name: Run adversarial diff review
        env:
          VERS_API_KEY: ${{ secrets.VERS_API_KEY }}
          VERS_REVIEW_COMMIT: 13b7c648-7849-4b9b-a788-16b4522edeb8
        run: controller/run-vers-review.sh review-input review-input/result.json

      - name: Validate and summarize assessment
        run: |
          jq . review-input/result.json
          jq -e '
            (
              .recommendation == "merge_as_is" and
              .quality_score >= 4 and
              (.confidence == "medium" or .confidence == "high") and
              (.findings | length == 0)
            ) or (
              .recommendation == "task_agent" and
              (.findings | length > 0)
            )
          ' review-input/result.json
          {
            printf '## Adversarial diff assessment\n\n'
            jq -r '"**Quality:** \(.quality_score)/5  \n**Confidence:** \(.confidence)  \n**Recommendation:** `\(.recommendation)`\n\n\(.summary)"' \
              review-input/result.json
            printf '\n\nThe recommendation is advisory; the integration coordinator owns disposition.\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Preserve assessment for the coordinator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adversarial-assessment-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: review-input/result.json
          if-no-files-found: error
          retention-days: 30

  gate:
    name: adversarial-diff-review
    if: ${{ always() }}
    needs:
      - validate
      - review
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require validation and adversarial review
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          printf 'validation: %s\nreview: %s\n' \
            "$VALIDATE_RESULT" "$REVIEW_RESULT"
          test "$VALIDATE_RESULT" = success
          test "$REVIEW_RESULT" = success
